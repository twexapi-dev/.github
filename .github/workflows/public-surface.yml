name: Check public surface

on:
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/public-surface.yml"
      - "profile/README.md"
      - "README.md"
      - "scripts/check-public-surface.mjs"
      - "scripts/public-projects.mjs"
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate org profile links and contracts
        run: node scripts/check-public-surface.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
